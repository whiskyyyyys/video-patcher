server {
    listen $PORT;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html app.html;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/javascript application/json application/xml+rss;

    # Security and caching headers
    location / {
        try_files $uri $uri/ /index.html;
        add_header X-Content-Type-Options "nosniff";
        add_header X-Frame-Options "SAMEORIGIN";
        add_header Referrer-Policy "strict-origin-when-cross-origin";
    }

    # Ensure JS scripts and Web Workers have the correct MIME types
    location ~* \.js$ {
        types {
            application/javascript js;
        }
        add_header Cache-Control "public, max-age=3600";
    }

    # Static media and fonts
    location ~* \.(css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        add_header Cache-Control "public, max-age=86400";
    }
}
